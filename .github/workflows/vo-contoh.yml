name: Contoh VO Reels
on:
  push:
    branches: [vo-contoh]
permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q playwright edge-tts
          python -m playwright install --with-deps chromium
      - run: |
          cd tools/video
          python render_video.py contoh/revisi-dikit.json /tmp/contoh-cowok-ardi.mp4 --vo id-ID-ArdiNeural --rate +5%
          python render_video.py contoh/revisi-dikit.json /tmp/contoh-cewek-gadis.mp4 --vo id-ID-GadisNeural --rate +5%
      - run: |
          mkdir /tmp/out && cd /tmp/out && git init -q -b vo-hasil && cp /tmp/contoh-*.mp4 .
          git -c user.name=bot -c user.email=bot@users.noreply.github.com add . && git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm hasil
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" vo-hasil
